name: Scrape Fixtures

on:
  # Run once daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # push-notify diffs against the previous commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Build personal calendars (.ics)
        run: npm run calendars

      - name: Commit updated fixtures & calendars
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fixtures.json public/calendars/*.ics
          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update fixtures & calendars [skip netlify]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push

      # After the push, so the fixtures page already shows the result when tapped.
      - name: Send push notifications for new results
        if: steps.commit.outputs.changed == 'true'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/push-notify.mjs
