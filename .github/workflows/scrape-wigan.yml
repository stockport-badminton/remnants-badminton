name: Scrape Wigan Fixtures

# Wigan (LeagueRepublic) needs a headless browser, so it runs weekly on its own
# rather than in the daily scrape. The daily job reads the cached JSON.
on:
  # Mondays 01:00 UTC (after the daily midnight run)
  schedule:
    - cron: '0 1 * * 1'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape Wigan fixtures
        run: npm run scrape:wigan

      - name: Build personal calendars (.ics)
        run: npm run calendars

      - name: Commit updated Wigan fixtures & calendars
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wigan-fixtures.json public/calendars/*.ics
          # Only commit if something actually changed
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: update Wigan fixtures & calendars [skip netlify]"

      - name: Push
        # push only if a commit was made
        run: |
          git diff HEAD~1 HEAD --quiet 2>/dev/null && echo "Nothing to push." || git push
